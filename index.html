<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pool Notice Board</title>
<meta name="theme-color" content="#E4002B">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PALETTE — approximations of lifeguard red/yellow, not official
   brand hex. Replace these if you have your centre's real spec.
   ============================================================ */
:root{
  --red:      #E4002B;
  --yellow:   #FFD400;
  --ink:      #0B0B0B;
  --paper:    #FFFFFF;

  --frame:    clamp(16px, 3.8vmin, 58px);   /* thickness of the red/yellow border */
  --radius:   clamp(10px, 2.2vmin, 28px);

  /* Footer geometry. These two values are the whole reason the
     message can never collide with the logo — see .footer below. */
  --logo-h:   clamp(30px, 6.6vmin, 82px);
  --footer-h: clamp(42px, 8.6vmin, 100px);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  /* 06 · Static flag — red over yellow, no motion. */
  background:linear-gradient(180deg, var(--red) 0 50%, var(--yellow) 50% 100%);
  font-family:"Barlow Condensed","Oswald","Arial Narrow",sans-serif;
  color:var(--ink);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}

.card{
  position:fixed;inset:var(--frame);z-index:1;
  background:var(--paper);
  border-radius:var(--radius);
  box-shadow:0 0 0 2px rgba(0,0,0,.12), 0 1.2vmin 3.6vmin rgba(60,0,10,.30);
  overflow:hidden;
  display:grid;
}

/* ============================ SETUP ============================ */
#setup{
  padding:clamp(20px,4vmin,56px);
  display:grid;grid-template-rows:auto 1fr auto;
  gap:clamp(14px,2.4vmin,30px);
  max-width:1100px;width:100%;margin:0 auto;
}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{
  font-family:"Anton",sans-serif;font-size:clamp(18px,2.9vmin,32px);
  letter-spacing:.06em;text-transform:uppercase;line-height:1;
}
.brand span{color:var(--red)}
.steps{display:flex;gap:8px;align-items:center}
.pip{width:clamp(26px,4vmin,44px);height:6px;border-radius:99px;background:#E6E6E6;transition:background .25s}
.pip.on{background:var(--red)}
.pip.done{background:var(--yellow)}

.pane{display:none;align-content:start;gap:clamp(10px,1.8vmin,20px)}
.pane.active{display:grid;animation:rise .3s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

label.q{
  font-family:"Anton",sans-serif;font-size:clamp(26px,5.6vmin,62px);
  line-height:1.02;text-transform:uppercase;
}
label.q em{color:var(--red);font-style:normal}
.hint{font-size:clamp(14px,2vmin,20px);font-weight:500;color:#6A6A6A;letter-spacing:.02em}
.hint.warn{color:#C25E00}
.hint.over{color:var(--red);font-weight:700}

textarea,input[type=text]{
  width:100%;font-family:"Anton",sans-serif;
  font-size:clamp(22px,4.4vmin,46px);line-height:1.15;
  color:var(--ink);background:#F6F6F6;
  border:3px solid #E2E2E2;border-left:10px solid var(--yellow);
  border-radius:10px;padding:clamp(12px,2vmin,20px);
  outline:none;resize:none;transition:border-color .18s,background .18s;
}
textarea{min-height:clamp(120px,24vmin,260px)}
textarea:focus,input[type=text]:focus{border-color:var(--red);border-left-color:var(--red);background:#fff}
::placeholder{color:#BFBFBF}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font-family:"Barlow Condensed",sans-serif;font-weight:700;
  font-size:clamp(13px,1.9vmin,18px);text-transform:uppercase;letter-spacing:.08em;
  padding:.5em 1em;border-radius:99px;border:2px solid #E2E2E2;background:#fff;color:#555;
  cursor:pointer;transition:.16s;
}
.chip:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px)}

.actions{display:flex;gap:12px;align-items:center;justify-content:flex-end}
.btn{
  font-family:"Anton",sans-serif;text-transform:uppercase;letter-spacing:.07em;
  font-size:clamp(16px,2.6vmin,26px);padding:.55em 1.4em;
  border:none;border-radius:99px;cursor:pointer;
  transition:transform .14s,box-shadow .14s;
}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 6px 0 #9E0020}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 8px 0 #9E0020}
.btn.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #9E0020}
.btn.ghost{background:transparent;color:#8A8A8A;box-shadow:inset 0 0 0 3px #E2E2E2}
.btn.ghost:hover{color:var(--ink);box-shadow:inset 0 0 0 3px #BDBDBD}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* ============================ DISPLAY ============================ */
#display{
  display:none;
  grid-template-rows:minmax(0,1fr) auto;   /* minmax(0,1fr): the message row is
                                              allowed to shrink. A plain "1fr"
                                              has an automatic minimum of the
                                              content size, which lets tall text
                                              push the footer off-screen. */
  padding:clamp(14px,3vmin,44px);
  height:100%;user-select:none;
}
#display.active{display:grid}

#msgbox{
  position:relative;min-height:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;                         /* hard backstop: if the fit were ever
                                              wrong, text clips instead of drawing
                                              over the logo. */
}
#msg{
  width:100%;
  font-family:"Anton",sans-serif;line-height:1.03;
  text-align:center;white-space:pre-wrap;overflow-wrap:break-word;
  font-size:16px;                           /* JS overwrites this */
}

.footer{
  flex:none;                                /* never shrinks */
  min-height:var(--footer-h);               /* space is reserved whether or not
                                               logo.png exists or loads */
  display:flex;align-items:center;gap:clamp(10px,1.8vmin,22px);
  margin-top:clamp(8px,1.6vmin,20px);
  padding-top:clamp(8px,1.4vmin,16px);
  border-top:3px solid #EDEDED;
}
#logo{
  height:var(--logo-h);width:auto;max-width:34%;
  object-fit:contain;object-position:left center;
  display:block;flex:none;
}
#logo.missing{visibility:hidden}           /* hidden, but still holds its row height */
#from{
  font-family:"Barlow Condensed",sans-serif;font-weight:600;
  font-size:clamp(15px,3vmin,38px);letter-spacing:.03em;line-height:1;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}

#tools{
  position:fixed;z-index:3;right:calc(var(--frame) + 14px);bottom:calc(var(--frame) + 14px);
  display:flex;gap:8px;transition:opacity .5s;
}
#tools.idle{opacity:0;pointer-events:none}
.tool{
  font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;font-size:14px;color:#8A8A8A;background:#fff;
  border:2px solid #E4E4E4;border-radius:99px;padding:.45em 1em;cursor:pointer;transition:.16s;
}
.tool:hover{color:var(--red);border-color:var(--red)}

@media (max-width:640px){
  .brandrow{flex-direction:column;align-items:flex-start;gap:10px}
}
</style>
</head>

<body>

<main class="card">

  <section id="setup">
    <div class="brandrow">
      <div class="brand">Pool <span>Notice</span></div>
      <div class="steps" aria-hidden="true">
        <div class="pip on" id="pip1"></div>
        <div class="pip" id="pip2"></div>
      </div>
    </div>

    <div>
      <div class="pane active" id="pane1">
        <label class="q" for="in-msg">What's the <em>notice</em>?</label>
        <div class="hint" id="counter">This is the big text in the middle. Line breaks are kept.</div>
        <textarea id="in-msg" placeholder="Pool closed for cleaning" autocomplete="off" spellcheck="true"></textarea>
        <div class="chips" id="chips"></div>
      </div>

      <div class="pane" id="pane2">
        <label class="q" for="in-from">Who's it <em>from</em>?</label>
        <div class="hint">Small text beside the logo. Leave blank to hide it.</div>
        <input id="in-from" type="text" maxlength="42" placeholder="Lifeguards" autocomplete="off">
      </div>
    </div>

    <div class="actions">
      <button class="btn ghost" id="btn-back" style="visibility:hidden">Back</button>
      <button class="btn primary" id="btn-next" disabled>Next</button>
    </div>
  </section>

  <section id="display">
    <div id="msgbox"><div id="msg"></div></div>
    <div class="footer">
      <img id="logo" src="logo.png" alt="">
      <div id="from"></div>
    </div>
  </section>

</main>

<div id="tools" style="display:none">
  <button class="tool" id="t-edit">Edit</button>
  <button class="tool" id="t-full">Full screen</button>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  var PRESETS = [
    "Pool closed",
    "No diving",
    "Lane 4 closed",
    "Squad training in progress",
    "Back in 10 minutes",
    "Slippery when wet"
  ];

  var SOFT_LIMIT = 90;   // past this the text starts getting small
  var HARD_LIMIT = 200;  // past this it will be hard to read from the far end

  /* ---------------------------------------------------------------
     STEP FLOW — state lives in the query string, not a second file.
     GitHub Pages has no server to hand state between pages, so
     accepting rewrites the URL to ?m=...&f=... . That makes the
     finished notice a bookmarkable link you can boot a screen into.
     --------------------------------------------------------------- */
  var step = 1;

  function setStep(n){
    step = n;
    $("pane1").classList.toggle("active", n === 1);
    $("pane2").classList.toggle("active", n === 2);
    $("pip1").className = "pip " + (n === 1 ? "on" : "done");
    $("pip2").className = "pip " + (n === 2 ? "on" : "");
    $("btn-back").style.visibility = n === 2 ? "visible" : "hidden";
    $("btn-next").textContent = n === 2 ? "Accept" : "Next";
    validate();
    setTimeout(function(){ (n === 1 ? $("in-msg") : $("in-from")).focus(); }, 60);
  }

  function validate(){
    var v = $("in-msg").value;
    var n = v.trim().length;
    var c = $("counter");
    if (n === 0){
      c.className = "hint";
      c.textContent = "This is the big text in the middle. Line breaks are kept.";
    } else if (n > HARD_LIMIT){
      c.className = "hint over";
      c.textContent = n + " characters — too long to read from across the pool. Trim it.";
    } else if (n > SOFT_LIMIT){
      c.className = "hint warn";
      c.textContent = n + " characters — this will render fairly small.";
    } else {
      c.className = "hint";
      c.textContent = n + " characters — good size.";
    }
    $("btn-next").disabled = (step === 1 && n === 0);
  }

  $("in-msg").addEventListener("input", validate);
  $("in-msg").addEventListener("keydown", function(e){
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); next(); }
  });
  $("in-from").addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); next(); }
  });
  $("btn-next").addEventListener("click", next);
  $("btn-back").addEventListener("click", function(){ setStep(1); });

  function next(){
    if (step === 1){
      if ($("in-msg").value.trim() === "") return;
      setStep(2);
    } else {
      show($("in-msg").value.trim(), $("in-from").value.trim(), true);
    }
  }

  PRESETS.forEach(function(text){
    var b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = text;
    b.addEventListener("click", function(){ $("in-msg").value = text; validate(); $("in-msg").focus(); });
    $("chips").appendChild(b);
  });

  /* Accepts "Bryan", "-Bryan" or "— Bryan"; always renders one dash. */
  function formatFrom(raw){
    if (!raw) return "";
    return "\u2014 " + raw.replace(/^[\s\-\u2013\u2014]+/, "");
  }

  /* ---------------------------------------------------------------
     TEXT FITTING
     Binary search on font-size. Valid because growing the font can
     never reduce the height required, so "does it fit" is monotonic
     even though line wrapping changes in discrete jumps.
     The box it measures against is the grid row ABOVE the footer,
     so a fit that succeeds cannot physically reach the logo.
     --------------------------------------------------------------- */
  var fitting = false;

  function refit(){
    if (fitting) return;                       // guard against observer re-entry
    fitting = true;

    var el = $("msg"), box = $("msgbox");
    var maxH = box.clientHeight, maxW = box.clientWidth;
    if (maxH > 0 && maxW > 0){
      var lo = 10, hi = maxH, best = lo;
      for (var i = 0; i < 15; i++){
        var mid = (lo + hi) / 2;
        el.style.fontSize = mid + "px";
        if (el.scrollHeight <= maxH && el.scrollWidth <= maxW + 1){ best = mid; lo = mid; }
        else { hi = mid; }
      }
      el.style.fontSize = (Math.floor(best * 100) / 100) + "px";
    }
    fitting = false;
  }

  /* ---------------------------------------------------------------
     SHOW
     --------------------------------------------------------------- */
  function show(message, from, writeUrl){
    $("msg").textContent = message;
    var f = formatFrom(from);
    $("from").textContent = f;
    $("from").style.display = f ? "block" : "none";
    document.title = message.replace(/\s+/g, " ").slice(0, 60);

    $("setup").style.display = "none";
    $("display").classList.add("active");
    $("tools").style.display = "flex";

    if (writeUrl){
      var q = "?m=" + encodeURIComponent(message) + (from ? "&f=" + encodeURIComponent(from) : "");
      try { history.replaceState(null, "", q); } catch (err) { /* sandboxed preview */ }
    }

    refit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
    idleWatch();
  }

  function edit(){
    $("display").classList.remove("active");
    $("setup").style.display = "grid";
    $("tools").style.display = "none";
    document.title = "Pool Notice Board";
    try { history.replaceState(null, "", location.pathname); } catch (err) {}
    setStep(1);
  }

  /* ---------------------------------------------------------------
     REFIT TRIGGERS
     ResizeObserver on the message box catches everything that changes
     the available space: window resize, rotation, entering full screen,
     AND the footer changing height when the logo loads. A window
     resize listener alone misses that last one.
     --------------------------------------------------------------- */
  if (window.ResizeObserver){
    var rt = null;
    new ResizeObserver(function(){
      clearTimeout(rt);
      rt = setTimeout(refit, 60);
    }).observe($("msgbox"));
  } else {
    window.addEventListener("resize", refit);
    window.addEventListener("orientationchange", refit);
  }

  $("logo").addEventListener("load", refit);
  $("logo").addEventListener("error", function(){
    this.classList.add("missing");   // keeps its space, shows nothing
    refit();
  });

  /* ---------------------------------------------------------------
     KIOSK CONTROLS
     --------------------------------------------------------------- */
  $("t-edit").addEventListener("click", edit);
  $("t-full").addEventListener("click", function(){
    if (!document.fullscreenElement){
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if (document.exitFullscreen){
      document.exitFullscreen();
    }
  });
  document.addEventListener("keydown", function(e){
    if (!$("display").classList.contains("active")) return;
    if (e.key === "Escape" || e.key.toLowerCase() === "e") edit();
    if (e.key.toLowerCase() === "f") $("t-full").click();
  });

  var idleTimer = null;
  function idleWatch(){
    clearTimeout(idleTimer);
    $("tools").classList.remove("idle");
    idleTimer = setTimeout(function(){ $("tools").classList.add("idle"); }, 4000);
  }
  ["mousemove","touchstart","keydown"].forEach(function(ev){
    document.addEventListener(ev, function(){
      if ($("display").classList.contains("active")) idleWatch();
    }, {passive:true});
  });

  /* ---------------------------------------------------------------
     BOOT
     --------------------------------------------------------------- */
  var params = new URLSearchParams(location.search);
  var m = params.get("m");
  if (m && m.trim()) show(m, params.get("f") || "", false);
  else setStep(1);
})();
</script>
</body>
</html>
